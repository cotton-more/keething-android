<!doctype html>
<!-- The listing's autofill screenshot (DEVELOPMENT.md, "The listing's screenshots"): a made-up mail service's
     sign-in, served at http://localhost:8000 through adb reverse; the showcase's Fjordmail entry answers on that
     address. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · Fjordmail</title>
<style>
  :root { --ink: #10233f; --muted: #5b6b82; --line: #d5dce6; --brand: #0f6e8c; --bg: #eef3f7; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
         font: 17px/1.45 -apple-system, "Roboto", "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 10px; padding: 22px 24px; font-weight: 700; font-size: 21px; }
  .mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #1b9cc0, #0f5f7a);
          display: grid; place-items: center; color: #fff; font-size: 19px; }
  main { margin: 8px 18px; padding: 28px 22px 30px; background: #fff; border-radius: 22px;
         box-shadow: 0 1px 2px rgba(16,35,63,.06), 0 8px 24px rgba(16,35,63,.06); }
  h1 { margin: 0 0 4px; font-size: 26px; }
  p { margin: 0 0 24px; color: var(--muted); }
  label { display: block; font-size: 14px; font-weight: 600; margin: 0 0 6px; }
  input { display: block; width: 100%; font: inherit; padding: 13px 14px; margin: 0 0 18px;
          border: 1.5px solid var(--line); border-radius: 12px; background: #fbfcfd; color: var(--ink); }
  input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(15,110,140,.15); }
  button { width: 100%; font: inherit; font-weight: 700; padding: 14px; margin-top: 6px; border: 0;
           border-radius: 12px; background: var(--brand); color: #fff; }
  .small { text-align: center; margin-top: 18px; font-size: 14px; color: var(--muted); }
</style>
<header><span class="mark">✉</span>Fjordmail</header>
<main>
  <h1>Sign in</h1>
  <p>Welcome back. Use your Fjordmail address.</p>
  <form onsubmit="return false">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="username" placeholder="you@fjordmail.com">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password">
    <button>Sign in</button>
  </form>
  <div class="small">Forgot your password?</div>
</main>
</html>
