<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:18px sans-serif;margin:24px}input{display:block;font-size:18px;margin:8px 0 16px;padding:8px;width:90%}</style><title>Login, new-password</title><h1>Login (new-password)</h1><p>A login whose password says new-password, as some sites write it to keep browsers from filling: by hand (long press &rsaquo; Autofill) an entry fills it.
<form onsubmit="return false"><input type="text" name="username" autocomplete="username" placeholder="Username">
<input type="password" name="password" autocomplete="new-password" placeholder="Password"><button>Log in</button></form>
