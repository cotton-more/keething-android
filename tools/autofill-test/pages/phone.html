<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font:18px sans-serif;margin:24px}input{display:block;font-size:18px;margin:8px 0 16px;padding:8px;width:90%}</style><title>Phone</title><h1>Phone login</h1><p>A country code beside the number: the entry's username goes into the number alone.
<form onsubmit="return false"><input type="tel" name="country" autocomplete="tel-country-code" placeholder="+49" style="width:20%">
<input type="tel" name="phone" autocomplete="tel-national" placeholder="Phone number">
<input type="password" name="password" autocomplete="current-password" placeholder="Password"><button>Log in</button></form>
